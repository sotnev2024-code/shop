<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ FootPredict · Telegram WebApp</title>
    <!-- Telegram WebApp SDK (official) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* dark theme base */
        body {
            background-color: #0a0f1a;
            color: #e5e9f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* main container with bottom nav spacing */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            padding: 16px 12px 90px 12px;
            flex: 1;
        }

        /* balance block */
        .balance-header {
            background: #1e2532;
            border-radius: 24px;
            padding: 20px 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid #2e3a4a;
            font-size: 16px;
            color: #8a9bb5;
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-header #balanceDisplay {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .balance-header #balanceDisplay span {
            font-size: 14px;
            color: #6d7f99;
            font-weight: 500;
        }

        /* filter bar */
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 4px 16px 4px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .filter-bar::-webkit-scrollbar {
            display: none;
        }
        .filter-chip {
            background: #1b2432;
            border: 1px solid #2e3b4c;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #b0c4de;
            white-space: nowrap;
            transition: all 0.2s;
            cursor: pointer;
        }
        .filter-chip.active {
            background: #2d8a5e;
            border-color: #41b07c;
            color: white;
        }
        .filter-chip i {
            margin-right: 6px;
        }

        /* section titles */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 16px 0 14px 8px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i {
            color: #5f7dbf;
        }
        .section-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 16px 0 14px 8px;
            flex-wrap: wrap;
        }
        .section-title-row .section-title {
            margin: 0;
        }
        .matches-date-picker {
            background: #1e2532;
            border: 1px solid #2e3a4a;
            border-radius: 14px;
            padding: 8px 12px;
            font-size: 14px;
            color: #f0f4fd;
            min-width: 140px;
        }
        .matches-date-picker:focus {
            outline: none;
            border-color: #5f7dbf;
        }

        /* match cards grid */
        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 20px;
        }

        .match-card {
            background: #151e2a;
            border-radius: 26px;
            padding: 18px 16px;
            border: 1px solid #2a3442;
            box-shadow: 0 6px 0 #0e141f;
            transition: transform 0.1s ease;
        }

        .league-badge {
            display: inline-block;
            background: #1f2b39;
            border-radius: 20px;
            padding: 4px 14px;
            margin-bottom: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #93b3de;
            border: 1px solid #334152;
        }

        .match-kickoff {
            font-size: 13px;
            color: #7a8fa8;
            margin-bottom: 10px;
        }
        .match-started-hint {
            font-size: 12px;
            color: #c45d5d;
            margin-bottom: 8px;
        }

        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 18px;
            color: #f0f4fd;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .team-badge {
            background: #253040;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .vs-dash {
            color: #5f738c;
            font-size: 14px;
            padding: 0 6px;
        }

        /* odds row */
        .odds-row {
            display: flex;
            justify-content: space-around;
            background: #101722;
            border-radius: 50px;
            padding: 8px 6px;
            margin-bottom: 18px;
            border: 1px solid #26303f;
        }

        .odd-btn {
            flex: 1;
            text-align: center;
            background: transparent;
            border: none;
            color: #b7c7e0;
            font-weight: 600;
            font-size: 16px;
            padding: 10px 0;
            border-radius: 40px;
            transition: all 0.15s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }

        .odd-btn small {
            font-size: 13px;
            font-weight: 400;
            color: #6b81a0;
        }

        .odd-btn.selected {
            background: #2f3e5a;
            color: white;
            box-shadow: 0 2px 0 #0f1a2b;
        }
        .odd-btn.selected small {
            color: #bdd3ff;
        }

        /* bet area */
        .bet-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .bet-input-wrapper {
            flex: 2;
            min-width: 110px;
            background: #101722;
            border-radius: 40px;
            border: 1px solid #2b384b;
            display: flex;
            align-items: center;
            padding: 4px 14px;
        }

        .bet-input-wrapper span {
            color: #7287a5;
            margin-right: 6px;
            font-weight: 500;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            outline: none;
            padding: 10px 0;
        }

        .bet-input::placeholder {
            color: #3d506b;
            font-weight: 400;
        }

        .place-bet-btn {
            background: #2d8a5e;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 40px;
            font-size: 15px;
            letter-spacing: 0.4px;
            box-shadow: 0 6px 0 #1b533a;
            cursor: pointer;
            transition: 0.08s linear;
            border: 1px solid #41b07c;
            flex: 1;
            white-space: nowrap;
        }

        .place-bet-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1b533a;
        }

        .place-bet-btn:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: 0 6px 0 #1b533a;
            pointer-events: none;
        }

        /* bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #121a26;
            border-top: 1px solid #253141;
            display: flex;
            justify-content: space-around;
            padding: 10px 8px 20px;
            backdrop-filter: blur(10px);
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.6);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #6b85a8;
            font-size: 12px;
            font-weight: 500;
            transition: color 0.2s;
            cursor: pointer;
            flex: 1;
            padding: 8px 0;
            border-radius: 40px;
        }

        .nav-item.active {
            color: #2d8a5e;
            background: #1e2c3a;
        }

        .nav-item i {
            font-size: 24px;
            filter: drop-shadow(0 2px 4px #00000050);
        }

        /* content panels */
        .panel {
            display: none;
            animation: fade 0.3s;
        }

        .panel.active {
            display: block;
        }

        @keyframes fade {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        /* Profile header with avatar and user info */
        .profile-header {
            background: #151e2a;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2b3445;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #2d8a5e, #1e5f40);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: white;
            border: 3px solid #41b07c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .user-info h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .user-info .username {
            color: #8a9bb5;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .user-balance-small {
            background: #1f2b39;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            font-weight: 600;
            color: #f5c542;
        }

        /* profile stats cards */
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #151e2a;
            padding: 18px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid #2b3445;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }
        .stat-label {
            color: #8a9bb5;
            font-size: 13px;
            margin-top: 4px;
        }

        /* toggle buttons for history/accruals */
        .toggle-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0 16px;
        }
        .toggle-btn {
            flex: 1;
            background: #1b2432;
            border: 1px solid #2e3b4c;
            border-radius: 40px;
            padding: 14px 0;
            font-weight: 600;
            color: #b0c4de;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: #2d8a5e;
            border-color: #41b07c;
            color: white;
        }

        /* history/accruals containers */
        .history-item, .accrual-item {
            background: #151e2a;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #263140;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-match {
            font-weight: 600;
        }
        .history-outcome {
            color: #8a9bb5;
            font-size: 14px;
        }
        .history-amount {
            font-weight: 700;
            color: #f5c542;
        }
        .history-result.win {
            color: #2d8a5e;
        }
        .history-result.loss {
            color: #c45d5d;
        }
        .history-item.clickable {
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .history-item.clickable:active {
            background: #1a2433;
        }

        /* Detail modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            background: #1e2532;
            border-radius: 24px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            border: 1px solid #2e3a4a;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border: none;
            background: #2b3648;
            color: #a0b4d0;
            font-size: 22px;
            line-height: 1;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .modal-close:active {
            background: #3a4558;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #f0f4fd;
            margin-bottom: 20px;
            padding-right: 40px;
        }
        .modal-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid #2a3442;
            font-size: 14px;
        }
        .modal-detail-row:last-child {
            border-bottom: none;
        }
        .modal-detail-label {
            color: #7a8fa8;
            margin-right: 12px;
        }
        .modal-detail-value {
            color: #f0f4fd;
            font-weight: 500;
            text-align: right;
        }

        .leaderboard-full {
            background: #151e2a;
            border-radius: 28px;
            padding: 16px 18px;
            border: 1px solid #2b3445;
        }
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #253040;
        }
        .leaderboard-item:last-child {
            border-bottom: none;
        }
        .rank {
            width: 36px;
            height: 36px;
            background: #202b3a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #9bb3d8;
            margin-right: 14px;
        }
        .player-info {
            flex: 1;
            font-weight: 600;
            font-size: 16px;
        }
        .player-info small {
            display: block;
            font-size: 12px;
            color: #6f87a8;
            font-weight: 400;
        }
        .player-score {
            font-weight: 700;
            font-size: 20px;
            color: #f5c542;
            text-shadow: 0 2px 3px #00000040;
        }

        .note-text {
            font-size: 12px;
            color: #667c9c;
            margin-left: 10px;
        }
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #667c9c;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Balance (shown on all panels) -->
        <div class="balance-header">
            <span>Ваш текущий баланс:</span>
            <span id="balanceDisplay">10,000 <span>pts</span></span>
        </div>

        <!-- Main Panel (Bets) -->
        <div id="panelBets" class="panel active">
            <div class="filter-bar" id="filterContainer"></div>
            <div class="section-title-row">
                <div class="section-title"><span>⚽</span> доступные матчи</div>
                <input type="date" id="matchesDatePicker" class="matches-date-picker" aria-label="Выберите дату">
            </div>
            <div class="matches-grid" id="matchesContainer"></div>
        </div>

        <!-- Leaderboard Panel -->
        <div id="panelLeaderboard" class="panel">
            <div class="section-title"><span>🏆</span> топ игроков</div>
            <div class="leaderboard-full" id="leaderboardContainer"></div>
            <div class="note-text" style="margin-top: 16px;">обновляется каждый час</div>
        </div>

        <!-- Profile Panel (обновленный) -->
        <div id="panelProfile" class="panel">
            <!-- шапка профиля с фото, именем, балансом -->
            <div class="profile-header" id="profileHeader">
                <!-- будет заполнено динамически -->
            </div>
            
            <!-- статистика (всего ставок и винрейт) -->
            <div class="profile-stats" id="profileStats"></div>
            
            <!-- кнопки переключения между историей и начислениями -->
            <div class="toggle-buttons">
                <div class="toggle-btn active" id="showHistoryBtn">📋 История ставок</div>
                <div class="toggle-btn" id="showAccrualsBtn">💰 Начисления</div>
            </div>
            
            <!-- контейнер для истории (активен по умолчанию) -->
            <div id="betHistoryContainer"></div>
            
            <!-- контейнер для начислений (изначально скрыт) -->
            <div id="accrualsContainer" style="display: none;"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" data-panel="bets"><i>⚽</i><span>Ставки</span></div>
        <div class="nav-item" data-panel="leaderboard"><i>🏆</i><span>Топ</span></div>
        <div class="nav-item" data-panel="profile"><i>👤</i><span>Профиль</span></div>
    </div>

    <!-- Модальное окно с подробной информацией -->
    <div id="detailModal" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-box">
            <button type="button" class="modal-close" id="modalCloseBtn" aria-label="Закрыть">×</button>
            <div class="modal-title" id="modalTitle">Подробности</div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        (function() {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.expand();
                tg.disableVerticalSwipes?.();
                tg.setHeaderColor?.(tg.themeParams?.bg_color || '#0a0f1a');
                tg.ready();
            }

            // Базовый URL API (тот же домен, что и WebApp)
            const API_BASE = window.location.origin || "";

            // ---------- STATE ----------
            let userBalance = 10000;
            let initialBalance = 10000;

            // Данные пользователя (из Telegram или демо)
            const user = tg?.initDataUnsafe?.user || { 
                first_name: 'Игрок', 
                username: 'football_fan',
                photo_url: null 
            };
            
            // Матчи: загружаются с API, без демо-данных
            let matches = [];
            let matchesLoaded = false;
            let matchesLoadError = false;

            let leagues = ['Все'];
            let activeLeague = 'Все';
            let selections = {};

            // История и начисления (загружаются с API)
            let betHistory = [];
            let accruals = [];

            let leaderboardData = [];
            let leaderboardLoaded = false;

            // Format helpers
            function formatPoints(num) { return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
            function updateBalanceUI() {
                document.getElementById('balanceDisplay').innerHTML = `${formatPoints(userBalance)} <span>pts</span>`;
                // также обновим маленький баланс в профиле, если он виден
                const smallBalance = document.getElementById('userSmallBalance');
                if (smallBalance) smallBalance.innerText = `${formatPoints(userBalance)} pts`;
            }

            // --- Работа с API бэкенда (матчи и баланс) ---

            async function fetchJson(url, options = {}) {
                try {
                    const headers = { ...(options.headers || {}) };
                    if (window.Telegram?.WebApp?.initData) {
                        headers['X-Init-Data'] = window.Telegram.WebApp.initData;
                    }
                    const res = await fetch(url, {
                        credentials: 'include',
                        ...options,
                        headers,
                    });
                    if (!res.ok) {
                        console.warn('API error', url, res.status);
                        return null;
                    }
                    return await res.json();
                } catch (e) {
                    console.warn('API request failed', url, e);
                    return null;
                }
            }

            async function loadUserPoints() {
                const data = await fetchJson(`${API_BASE}/api/v1/football/points`);
                if (data && typeof data.competition_points_balance === 'number') {
                    userBalance = data.competition_points_balance;
                    initialBalance = data.competition_points_balance;
                    updateBalanceUI();
                    renderFullProfile();
                }
            }

            async function loadBetHistory() {
                const data = await fetchJson(`${API_BASE}/api/v1/football/bets/history`);
                if (data && Array.isArray(data.bets)) {
                    betHistory = data.bets.map(b => ({
                        match: b.match,
                        outcome: b.outcome,
                        amount: b.amount,
                        result: b.result === 'won' ? 'win' : (b.result === 'lost' ? 'loss' : 'pending'),
                        payout: b.payout,
                        created_at: b.created_at || null,
                        odds: b.odds,
                    }));
                } else {
                    betHistory = [];
                }
                renderBetHistory();
                renderProfileStats();
            }

            async function loadAccruals() {
                const data = await fetchJson(`${API_BASE}/api/v1/football/accruals`);
                if (data && Array.isArray(data.accruals)) {
                    accruals = data.accruals.map(a => ({
                        date: a.date,
                        type: a.type,
                        points: a.points,
                        created_at: a.created_at || null,
                    }));
                } else {
                    accruals = [];
                }
                renderAccruals();
            }

            // Форматирование даты/времени матча — всегда по Москве (МСК)
            const TZ_MOSCOW = 'Europe/Moscow';
            function formatMatchTime(kickoffAt, timezone) {
                if (!kickoffAt) return '';
                try {
                    const date = new Date(kickoffAt);
                    if (isNaN(date.getTime())) return '';
                    return new Intl.DateTimeFormat('ru-RU', {
                        day: 'numeric',
                        month: 'short',
                        hour: '2-digit',
                        minute: '2-digit',
                        timeZone: TZ_MOSCOW,
                    }).format(date);
                } catch (e) {
                    return '';
                }
            }

            function adaptBackendMatches(apiMatches) {
                if (!Array.isArray(apiMatches)) return;
                matches = apiMatches.map((m, idx) => {
                    const leagueName = m.league?.name || 'Лига';
                    const odds = m.odds || {};
                    return {
                        id: String(m.fixture_id ?? idx),
                        league: leagueName,
                        home: m.home_team?.name || 'Home',
                        away: m.away_team?.name || 'Away',
                        oddsHome: odds.odd_home ?? 0,
                        oddsDraw: odds.odd_draw ?? 0,
                        oddsAway: odds.odd_away ?? 0,
                        leagueLogo: m.league?.logo || null,
                        badgeH: m.home_team?.logo || 'H',
                        badgeA: m.away_team?.logo || 'A',
                        kickoffAt: m.kickoff_at || m.date || null,
                        timezone: m.timezone || 'UTC',
                        status: m.status || m.status_short || null,
                    };
                });
                leagues = [...new Set(matches.map(m => m.league))];
                activeLeague = 'Все';
                selections = {};
                renderFilters();
                renderMatches();
            }

            function getTodayDateStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            async function loadMatchesForDate(dateStr) {
                matchesLoadError = false;
                renderMatches();
                const url = dateStr
                    ? `${API_BASE}/api/v1/football/matches/today?date=${encodeURIComponent(dateStr)}`
                    : `${API_BASE}/api/v1/football/matches/today`;
                const data = await fetchJson(url);
                matchesLoaded = true;
                if (data && Array.isArray(data.matches)) {
                    adaptBackendMatches(data.matches);
                } else {
                    matches = [];
                    leagues = ['Все'];
                    if (data === null) matchesLoadError = true;
                    renderFilters();
                    renderMatches();
                }
            }

            async function loadTodayMatches() {
                const picker = document.getElementById('matchesDatePicker');
                const dateStr = picker ? picker.value : getTodayDateStr();
                await loadMatchesForDate(dateStr);
            }

            // Render profile header with avatar and user info
            function renderProfileHeader() {
                const headerDiv = document.getElementById('profileHeader');
                const firstName = user.first_name || 'Игрок';
                const username = user.username ? '@' + user.username : 'футбольный фанат';
                const avatarLetter = firstName.charAt(0).toUpperCase();
                
                // Если есть фото от Telegram — показываем его, иначе букву
                let avatarHtml;
                if (user.photo_url) {
                    avatarHtml = `
                        <div class="avatar" style="overflow: hidden;">
                            <img src="${user.photo_url}" alt="${firstName}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
                        </div>
                    `;
                } else {
                    avatarHtml = `<div class="avatar">${avatarLetter}</div>`;
                }
                
                headerDiv.innerHTML = `
                    ${avatarHtml}
                    <div class="user-info">
                        <h2>${firstName}</h2>
                        <div class="username">${username}</div>
                        <div class="user-balance-small" id="userSmallBalance">${formatPoints(userBalance)} pts</div>
                    </div>
                `;
            }

            // Profile stats
            function renderProfileStats() {
                const statsDiv = document.getElementById('profileStats');
                const totalBets = betHistory.length;
                const wins = betHistory.filter(b => b.result === 'win').length;
                const winRate = totalBets ? Math.round((wins/totalBets)*100) : 0;
                statsDiv.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${totalBets}</div>
                        <div class="stat-label">Всего ставок</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${winRate}%</div>
                        <div class="stat-label">Винрейт</div>
                    </div>
                `;
            }

            // Render bet history
            function renderBetHistory() {
                const container = document.getElementById('betHistoryContainer');
                if (!container) return;
                
                let html = '';
                betHistory.slice(0, 10).forEach((b, idx) => {
                    const resultClass = b.result === 'win' ? 'win' : (b.result === 'loss' ? 'loss' : '');
                    const resultText = b.result === 'win' ? '✅' : (b.result === 'loss' ? '❌' : '⏳');
                    const payoutText = b.payout ? `+${b.payout}` : '';
                    html += `
                        <div class="history-item clickable" data-type="bet" data-index="${idx}">
                            <div>
                                <div class="history-match">${b.match}</div>
                                <div class="history-outcome">${b.outcome}</div>
                            </div>
                            <div style="text-align: right;">
                                <div class="history-amount">${b.amount} pts</div>
                                <div class="history-result ${resultClass}">${resultText} ${payoutText}</div>
                            </div>
                        </div>
                    `;
                });
                if (html === '') {
                    html = '<div class="empty-state">История ставок пуста</div>';
                }
                container.innerHTML = html;
                attachDetailModalListeners();
            }

            // Render accruals
            function renderAccruals() {
                const container = document.getElementById('accrualsContainer');
                if (!container) return;
                
                let html = '';
                accruals.slice(0, 10).forEach((a, idx) => {
                    const sign = a.points >= 0 ? '+' : '';
                    html += `
                        <div class="history-item clickable" data-type="accrual" data-index="${idx}">
                            <div>
                                <div class="history-match">${a.date}</div>
                                <div class="history-outcome">${a.type}</div>
                            </div>
                            <div class="history-amount">${sign}${a.points} pts</div>
                        </div>
                    `;
                });
                if (html === '') {
                    html = '<div class="empty-state">Нет начислений</div>';
                }
                container.innerHTML = html;
                attachDetailModalListeners();
            }

            function formatDateTime(isoStr) {
                if (!isoStr) return '—';
                try {
                    const d = new Date(isoStr);
                    if (isNaN(d.getTime())) return isoStr;
                    return new Intl.DateTimeFormat('ru-RU', {
                        day: 'numeric', month: 'short', year: 'numeric',
                        hour: '2-digit', minute: '2-digit',
                        timeZone: 'Europe/Moscow',
                    }).format(d);
                } catch (e) { return isoStr; }
            }

            function openBetDetailModal(index) {
                const b = betHistory[index];
                if (!b) return;
                const resultText = b.result === 'win' ? 'Выигрыш' : (b.result === 'loss' ? 'Проигрыш' : 'В ожидании');
                const payoutStr = b.payout != null ? `${b.payout} pts` : '—';
                const oddsStr = b.odds != null ? String(b.odds) : '—';
                document.getElementById('modalTitle').textContent = '📋 Ставка';
                document.getElementById('modalContent').innerHTML = `
                    <div class="modal-detail-row"><span class="modal-detail-label">Матч</span><span class="modal-detail-value">${b.match}</span></div>
                    <div class="modal-detail-row"><span class="modal-detail-label">Исход</span><span class="modal-detail-value">${b.outcome}</span></div>
                    <div class="modal-detail-row"><span class="modal-detail-label">Сумма ставки</span><span class="modal-detail-value">${b.amount} pts</span></div>
                    <div class="modal-detail-row"><span class="modal-detail-label">Коэффициент</span><span class="modal-detail-value">${oddsStr}</span></div>
                    <div class="modal-detail-row"><span class="modal-detail-label">Результат</span><span class="modal-detail-value">${resultText}</span></div>
                    <div class="modal-detail-row"><span class="modal-detail-label">Выигрыш</span><span class="modal-detail-value">${payoutStr}</span></div>
                    <div class="modal-detail-row"><span class="modal-detail-label">Дата и время</span><span class="modal-detail-value">${formatDateTime(b.created_at)}</span></div>
                `;
                const modal = document.getElementById('detailModal');
                modal.classList.remove('hidden');
                modal.setAttribute('aria-hidden', 'false');
            }

            function openAccrualDetailModal(index) {
                const a = accruals[index];
                if (!a) return;
                const sign = a.points >= 0 ? '+' : '';
                document.getElementById('modalTitle').textContent = '💰 Начисление';
                document.getElementById('modalContent').innerHTML = `
                    <div class="modal-detail-row"><span class="modal-detail-label">Дата</span><span class="modal-detail-value">${a.date}</span></div>
                    <div class="modal-detail-row"><span class="modal-detail-label">Тип</span><span class="modal-detail-value">${a.type}</span></div>
                    <div class="modal-detail-row"><span class="modal-detail-label">Сумма</span><span class="modal-detail-value">${sign}${a.points} pts</span></div>
                    <div class="modal-detail-row"><span class="modal-detail-label">Дата и время</span><span class="modal-detail-value">${formatDateTime(a.created_at)}</span></div>
                `;
                const modal = document.getElementById('detailModal');
                modal.classList.remove('hidden');
                modal.setAttribute('aria-hidden', 'false');
            }

            function closeDetailModal() {
                const modal = document.getElementById('detailModal');
                modal.classList.add('hidden');
                modal.setAttribute('aria-hidden', 'true');
            }

            function attachDetailModalListeners() {
                document.querySelectorAll('#betHistoryContainer .history-item.clickable[data-type="bet"]').forEach(el => {
                    el.onclick = function() {
                        const idx = parseInt(this.getAttribute('data-index'), 10);
                        if (!isNaN(idx)) openBetDetailModal(idx);
                    };
                });
                document.querySelectorAll('#accrualsContainer .history-item.clickable[data-type="accrual"]').forEach(el => {
                    el.onclick = function() {
                        const idx = parseInt(this.getAttribute('data-index'), 10);
                        if (!isNaN(idx)) openAccrualDetailModal(idx);
                    };
                });
            }

            function setupModalClose() {
                const modal = document.getElementById('detailModal');
                const closeBtn = document.getElementById('modalCloseBtn');
                if (closeBtn) closeBtn.addEventListener('click', closeDetailModal);
                if (modal) {
                    modal.addEventListener('click', function(e) {
                        if (e.target === modal) closeDetailModal();
                    });
                    const box = modal.querySelector('.modal-box');
                    if (box) box.addEventListener('click', function(e) { e.stopPropagation(); });
                }
            }

            // Toggle between history and accruals
            function setupProfileToggles() {
                const historyBtn = document.getElementById('showHistoryBtn');
                const accrualsBtn = document.getElementById('showAccrualsBtn');
                const historyContainer = document.getElementById('betHistoryContainer');
                const accrualsContainer = document.getElementById('accrualsContainer');
                
                historyBtn.addEventListener('click', () => {
                    historyBtn.classList.add('active');
                    accrualsBtn.classList.remove('active');
                    historyContainer.style.display = 'block';
                    accrualsContainer.style.display = 'none';
                });
                
                accrualsBtn.addEventListener('click', () => {
                    accrualsBtn.classList.add('active');
                    historyBtn.classList.remove('active');
                    accrualsContainer.style.display = 'block';
                    historyContainer.style.display = 'none';
                    renderAccruals(); // обновим на всякий случай
                });
            }

            // Full profile render
            function renderFullProfile() {
                renderProfileHeader();
                renderProfileStats();
                renderBetHistory();
                renderAccruals();
            }

            // Filters and matches
            function renderFilters() {
                const container = document.getElementById('filterContainer');
                let html = `<div class="filter-chip ${activeLeague === 'Все' ? 'active' : ''}" data-league="Все"><i>🏆</i>Все</div>`;
                leagues.forEach(l => {
                    html += `<div class="filter-chip ${activeLeague === l ? 'active' : ''}" data-league="${l}">${l}</div>`;
                });
                container.innerHTML = html;
                document.querySelectorAll('.filter-chip').forEach(chip => {
                    chip.addEventListener('click', function() {
                        activeLeague = this.dataset.league;
                        renderFilters();
                        renderMatches();
                    });
                });
            }

            function renderMatches() {
                const container = document.getElementById('matchesContainer');
                if (!container) return;
                if (!matchesLoaded) {
                    container.innerHTML = '<div class="empty-state">Загрузка матчей…</div>';
                    return;
                }
                if (matchesLoadError && matches.length === 0) {
                    container.innerHTML = '<div class="empty-state">Не удалось загрузить матчи. Проверьте подключение и обновите страницу.</div>';
                    return;
                }
                const filtered = activeLeague === 'Все' ? matches : matches.filter(m => m.league === activeLeague);
                let htmlStr = '';
                filtered.forEach(m => {
                    const sel = selections[m.id] || { outcome: null, amount: '' };
                    const selectedOutcome = sel.outcome;
                    const btnHomeClass = `odd-btn ${selectedOutcome === 'H' ? 'selected' : ''}`;
                    const btnDrawClass = `odd-btn ${selectedOutcome === 'D' ? 'selected' : ''}`;
                    const btnAwayClass = `odd-btn ${selectedOutcome === 'A' ? 'selected' : ''}`;
                    const betAmount = sel.amount || '';

                    const kickoffStr = formatMatchTime(m.kickoffAt, m.timezone);
                    const isMatchStarted = m.kickoffAt ? (Date.now() >= new Date(m.kickoffAt).getTime()) : false;
                    htmlStr += `
                        <div class="match-card" data-match-id="${m.id}">
                            <div class="league-badge">${m.league}</div>
                            ${kickoffStr ? `<div class="match-kickoff">${kickoffStr}</div>` : ''}
                            ${isMatchStarted ? '<div class="match-started-hint">Матч начался — ставки закрыты</div>' : ''}
                            <div class="teams-row">
                                <div class="team">
                                    <span class="team-badge">${
                                        m.badgeH && typeof m.badgeH === 'string' && m.badgeH.startsWith('http')
                                            ? `<img src="${m.badgeH}" alt="" style="width:24px;height:24px;border-radius:50%;">`
                                            : m.badgeH
                                    }</span>
                                    ${m.home}
                                </div>
                                <span class="vs-dash">VS</span>
                                <div class="team">
                                    ${m.away}
                                    <span class="team-badge">${
                                        m.badgeA && typeof m.badgeA === 'string' && m.badgeA.startsWith('http')
                                            ? `<img src="${m.badgeA}" alt="" style="width:24px;height:24px;border-radius:50%;">`
                                            : m.badgeA
                                    }</span>
                                </div>
                            </div>
                            <div class="odds-row">
                                <button class="${btnHomeClass}" data-match="${m.id}" data-outcome="H">${m.oddsHome} <small>home</small></button>
                                <button class="${btnDrawClass}" data-match="${m.id}" data-outcome="D">${m.oddsDraw} <small>draw</small></button>
                                <button class="${btnAwayClass}" data-match="${m.id}" data-outcome="A">${m.oddsAway} <small>away</small></button>
                            </div>
                            <div class="bet-area">
                                <div class="bet-input-wrapper">
                                    <span>⚡</span>
                                    <input class="bet-input" type="number" placeholder="сумма" min="1" value="${betAmount}" data-match-id="${m.id}" id="input-${m.id}" ${isMatchStarted ? 'disabled' : ''}>
                                </div>
                                <button class="place-bet-btn" data-match-id="${m.id}" id="betbtn-${m.id}" ${isMatchStarted ? 'disabled' : ''}>${isMatchStarted ? 'Ставки закрыты' : 'Ставка'}</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = htmlStr || '<div class="empty-state">Нет матчей на выбранный период</div>';
                attachMatchEvents();
            }

            async function loadLeaderboard() {
                const data = await fetchJson(`${API_BASE}/api/v1/football/leaderboard`);
                leaderboardLoaded = true;
                if (data && Array.isArray(data.leaderboard)) {
                    leaderboardData = data.leaderboard;
                }
                renderLeaderboard();
            }

            function renderLeaderboard() {
                const container = document.getElementById('leaderboardContainer');
                if (!container) return;
                let html = '';
                if (!leaderboardLoaded) {
                    html = '<div class="empty-state">Загрузка топа…</div>';
                } else if (leaderboardData.length === 0) {
                    html = '<div class="empty-state">Пока никого в топе</div>';
                } else {
                    leaderboardData.forEach((p) => {
                        const tag = p.tag ? ' <small>' + p.tag + '</small>' : '';
                        html += '<div class="leaderboard-item"><div class="rank">' + p.rank + '</div><div class="player-info">' + (p.name || 'Игрок') + tag + '</div><div class="player-score">' + formatPoints(p.score) + '</div></div>';
                    });
                }
                container.innerHTML = html;
            }

            function showPanel(panelId) {
                document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
                var el = document.getElementById('panel' + panelId);
                if (el) el.classList.add('active');
                document.querySelectorAll('.nav-item').forEach(function(item) { item.classList.remove('active'); });
                var nav = document.querySelector('.nav-item[data-panel="' + panelId.toLowerCase() + '"]');
                if (nav) nav.classList.add('active');
                if (panelId === 'Profile') { loadBetHistory(); loadAccruals(); renderFullProfile(); }
                if (panelId === 'Leaderboard') loadLeaderboard();
                if (panelId === 'Bets') { renderFilters(); renderMatches(); }
            }

            function attachMatchEvents() {
                document.querySelectorAll('.odd-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const matchId = this.dataset.match;
                        const outcome = this.dataset.outcome;
                        if (!matchId || !outcome) return;
                        if (!selections[matchId]) selections[matchId] = { outcome: null, amount: '' };
                        selections[matchId].outcome = outcome;
                        renderMatches();
                    });
                });

                document.querySelectorAll('.bet-input').forEach(inp => {
                    inp.addEventListener('input', function(e) {
                        const matchId = this.dataset.matchId;
                        const val = this.value;
                        if (!selections[matchId]) selections[matchId] = { outcome: null, amount: '' };
                        selections[matchId].amount = val;
                    });
                });

                document.querySelectorAll('.place-bet-btn').forEach(btn => {
                    btn.addEventListener('click', async function(e) {
                        const matchId = this.dataset.matchId;
                        const match = matches.find(m => m.id === matchId);
                        if (!match) return;
                        const sel = selections[matchId] || { outcome: null, amount: '' };
                        const outcome = sel.outcome;
                        const amount = parseInt(sel.amount, 10);
                        if (!outcome) { tg?.showAlert?.('❌ Выберите исход'); return; }
                        if (!amount || amount <= 0) { tg?.showAlert?.('⚠️ Введите сумму'); return; }
                        if (amount > userBalance) {
                            tg?.showAlert?.(`Нельзя поставить больше, чем есть на балансе. Ваш баланс: ${formatPoints(userBalance)} pts`);
                            return;
                        }
                        if (match.kickoffAt) {
                            const kickoff = new Date(match.kickoffAt).getTime();
                            if (Date.now() >= kickoff) {
                                tg?.showAlert?.('Матч уже начался. Ставки не принимаются.');
                                return;
                            }
                        }

                        const odds = outcome === 'H' ? match.oddsHome : (outcome === 'D' ? match.oddsDraw : match.oddsAway);
                        const matchLabel = `${match.home} - ${match.away}`;
                        const fixtureId = parseInt(matchId, 10) || 0;
                        if (!fixtureId) { tg?.showAlert?.('Ошибка: неверный матч'); return; }

                        const headers = { 'Content-Type': 'application/json' };
                        if (window.Telegram?.WebApp?.initData) headers['X-Init-Data'] = window.Telegram.WebApp.initData;
                        const res = await fetch(`${API_BASE}/api/v1/football/bets`, {
                            method: 'POST',
                            credentials: 'include',
                            headers,
                            body: JSON.stringify({
                                fixture_id: fixtureId,
                                match_label: matchLabel,
                                outcome: outcome,
                                amount: amount,
                                odds: odds,
                                kickoff_at: match.kickoffAt || null,
                            }),
                        });
                        const data = await res.json().catch(() => ({}));
                        if (!res.ok || !data.success) {
                            tg?.showAlert?.(data.detail || 'Не удалось принять ставку');
                            return;
                        }
                        const resData = data;
                        userBalance = resData.competition_points_balance;
                        updateBalanceUI();
                        const potentialWin = Math.round(amount * odds * 100) / 100;
                        tg?.showAlert?.(`✅ Ставка принята! Потенциальный выигрыш: ${potentialWin} pts`);

                        if (selections[matchId]) selections[matchId].amount = '';
                        await loadBetHistory();
                        await loadAccruals();
                        renderMatches();
                        renderFullProfile();
                        tg?.HapticFeedback?.notification('success');
                    });
                });
            }

            // Full render on load
            setupModalClose();
            setupProfileToggles();
            renderFilters();
            renderMatches();
            loadLeaderboard();
            renderFullProfile();
            updateBalanceUI();

            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.addEventListener('click', function() {
                    var panel = this.getAttribute('data-panel');
                    if (panel === 'bets') showPanel('Bets');
                    else if (panel === 'leaderboard') showPanel('Leaderboard');
                    else if (panel === 'profile') showPanel('Profile');
                });
            });

            var matchesDatePicker = document.getElementById('matchesDatePicker');
            if (matchesDatePicker) {
                matchesDatePicker.value = getTodayDateStr();
                matchesDatePicker.addEventListener('change', function() {
                    loadMatchesForDate(this.value);
                });
            }

            loadUserPoints();
            loadTodayMatches();
            loadBetHistory();
            loadAccruals();
        })();
    </script>
</body>
</html>
